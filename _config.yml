# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "EPED Grenoble"
masthead_title: "EPED · Église évangélique à Grenoble"
title_separator: "-"
name: "Église protestante évangélique du Drac"
email: contact@epe-drac.fr
description: >-
  Église protestante évangélique à Grenoble (EPED), 163 cours Berriat, tram A
  Berriat - Le Magasin. Culte chaque dimanche à 10h15, accueil des enfants,
  groupes de maison dans toute l'agglomération grenobloise.
baseurl: ""
url: "https://www.epe-drac.fr"
logo: "/images/eped_fs.png"
og_image: "/images/eped-culte-grenoble-og.jpg"
twitter_username: epedrac
github_username: epedrac
facebook_username: egliseProtestanteEvangeliqueDuDrac
social:
  type: Organization
  name: "Église protestante évangélique du Drac"
  links:
    - "https://www.instagram.com/eped.gre"
    - "https://www.facebook.com/egliseProtestanteEvangeliqueDuDrac"
    - "https://podcast.ausha.co/podcast-predications-de-l-eglise-de-l-eped/"
# Codes de vérification à renseigner après inscription (voir SEO.md)
google_site_verification:
bing_site_verification:
atom_feed:
  hide: true
# Build settings
# theme: minima
# theme: minimal-mistakes-jekyll
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-redirect-from

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
# show_date: true
locale: "fr-FR"
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      # comments: true
      # share: true
      related: true
date_format: "%d-%m-%Y"
exclude:
  - _layouts.old/
  - _posts_bak/
  - myblog/
  - Gemfile
  - Gemfile.lock
  - Gemfile.lock.bak
  - README.md
  - SEO.md
